# Data releases are independent of application releases. Failed validation leaves
# the last published catalog untouched; clients validate again before installing.
name: Sync model catalog

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-model-catalog.yml'
      - 'frontend/scripts/*model-catalog*'
      - 'frontend/src/shared/modelCatalog/**'

permissions:
  contents: write

concurrency:
  group: sync-model-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ChenyqThu/MailAgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install validation dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Regenerate snapshot
        run: node frontend/scripts/sync-model-catalog.mjs
      - name: Validate catalog and build publication
        working-directory: frontend
        run: |
          pnpm exec vitest run tests/shared/modelCatalog tests/shared/providerIcons.test.ts
          pnpm exec tsx scripts/prepare-model-catalog.ts
      - name: Publish data branch atomically
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const branch = 'codex/model-catalog';
            let parent;
            try {
              parent = (await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = fs.readFileSync('frontend/model-catalog-publication.json', 'utf8');
            const blob = await github.rest.git.createBlob({ owner, repo, content, encoding: 'utf-8' });
            const tree = await github.rest.git.createTree({ owner, repo, tree: [
              { path: 'catalog.json', mode: '100644', type: 'blob', sha: blob.data.sha }
            ] });
            const commit = await github.rest.git.createCommit({ owner, repo,
              message: `Update model catalog (${context.sha})`, tree: tree.data.sha,
              parents: parent ? [parent] : [] });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
            }
