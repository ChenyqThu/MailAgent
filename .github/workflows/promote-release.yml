# Promote release (E0 WP4)
#
# 背景: build-mac.yml 在 tag push 后用 `electron-builder --publish always` 把 5 件 feed
# (latest-mac.yml + zip/dmg + blockmap) 传到一个 **draft** release; draft 不更新
# `releases/latest`, auto-update feed 也不生效。转正式过去是纯手动步骤
# (`gh release edit <tag> --draft=false --latest`), 漏做 → latest 停在旧版。
#
# 本 workflow 把「手动步骤」变成「手动点一下的机器步骤」(保留 tag 后人工 dogfood 验包窗口,
# 故不做 build 成功自动转正): Actions → Promote release → 输入 tag → Run。
# 步骤 = edit 转正式 + 置 latest + 校验 releases/latest 确实指向该 tag。
#
# 注意: 不传 --notes / --notes-file — 保留 CI draft 上已有的 release notes。

name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write # gh release edit

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      # 08-17 owner 拍板 Windows 转正式发布轨 ⇒ 每个正式 Release 都必须带 win 包。
      #
      # 为什么放在 promote 而不是让 build-win.yml 自己 publish: mac 与 win 是两个并行 workflow,
      # 各自 publish 同一个 tag 时可能同时走到「release 不存在 → 创建」而互相踩。promote 是本来
      # 就串行的人工步骤 (tag 后留验包窗口), 在这里收产物结构上不可能有竞态。
      #
      # 🔴 找不到 win 产物即 fail —— 宁可红在这里, 也不要发出一个「说好带 Windows 包却没带」的
      # 正式 Release; 那种缺失只有用户会发现。
      - name: Attach Windows installer + update feed
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow=build-win.yml --branch "$TAG" --limit 1 \
            --json databaseId,conclusion --jq '.[0] | select(.conclusion=="success") | .databaseId')
          if [ -z "${run_id:-}" ]; then
            echo "::error::找不到 tag $TAG 上成功的 build-win.yml run — 先确认它跑过且 success (gh run list --workflow=build-win.yml --branch $TAG)"
            exit 1
          fi
          echo "win build run = $run_id"
          dir=$(mktemp -d)
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n MailAgent-win-x64 -D "$dir"
          # artifact 里应有 .exe + .exe.blockmap + latest.yml (build-win.yml 的 upload path)。
          # 缺 latest.yml = Windows 端拿不到自更新 feed, 与 mac 体验不对等 → 当场 fail。
          test -f "$dir/latest.yml" || {
            echo "::error::win artifact 缺 latest.yml — 检查 electron-builder.yml 的 win.publish 是否仍为 null"; exit 1; }
          ls -la "$dir"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$dir"/*.exe "$dir"/*.exe.blockmap "$dir"/latest.yml
          echo "✓ Windows 产物已附加到 $TAG"

      - name: Promote draft release to published + latest
        # tag 不存在 / 无对应 release → gh 非零退出, job 直接红。
        # --title 对齐现行手动流程格式 "MailAgent vX.Y.Z" (见 CLAUDE.md 打包/发布节)。
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --title "MailAgent $TAG"
          echo "✓ gh release edit $TAG done"

      - name: Verify releases/latest == tag
        # 现行手动流程的验证步骤机器化:
        #   gh api repos/<repo>/releases/latest --jq .tag_name 必须 == tag。
        # edit 后 API 视图偶有传播延迟, 重试 3 次 (5s 间隔) 防 flake。
        run: |
          latest=""
          for i in 1 2 3; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || echo "")
            if [[ "$latest" == "$TAG" ]]; then
              echo "✓ releases/latest = $latest"
              exit 0
            fi
            echo "attempt $i: releases/latest='$latest' != '$TAG', retry in 5s..."
            sleep 5
          done
          echo "::error::releases/latest ('$latest') != '$TAG' — promote 未生效或被更新的 release 抢占 latest, 需人工检查 gh release list。"
          exit 1
