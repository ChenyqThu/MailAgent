<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>MailAgent</title>
    <!--
      Content-Security-Policy. `script-src 'self'` alone would block the
      inline FOUC bootstrap below (no-FOUC requires synchronous inline
      execution before paint). We allow that one script via its sha256
      hash — if the FOUC bootstrap changes the hash must be updated.
      Vite dev server occasionally injects `'unsafe-inline'`-needing
      hydration scripts; we accept that for dev (host script runs from
      `'self'` http://localhost:5173) but the prod build path serves the
      same hash-locked inline script from a file:// origin.
      connect-src adds `ws:` for vite HMR; `http://localhost:5173` for the
      dev module server. Production wraps these in is.dev gating.
      🔴 V2.1 3c cutover — renderer 进程内跑 ChatRuntime 直 fetch loopback
      serve-api，baseUrl 恒 `http://127.0.0.1:<port>/api`（ElectronApi
      loopbackChatBaseUrl；serve-api bind IPv4 127.0.0.1，**不能**用 localhost
      —— macOS 下 localhost 可能解析到 IPv6 ::1 → 连接失败）。CSP 里
      `127.0.0.1` ≠ `localhost`（不同 host），故 connect-src 必须显式放行
      `http://127.0.0.1:*`，否则 chat 全部 fetch 被 CSP 拦在请求发出前
      （main webRequest token/CORS 注入根本没机会跑）→ chat 完全无响应。

      img-src whitelist (review round 9):
        - 'self' / data: / file:     本地资源 / inline data URI / 本地附件
        - https://*.onecdn.static.microsoft  Office/Outlook 邮件正文里嵌的
                                              sysfile.svg 等附件类型图标
                                              (line 16 起源全是 Microsoft CDN)
      安全权衡: 加这个 CDN 意味着任何邮件都可以从该域加载图片. Microsoft CDN
      不是已知 tracking 域, 只服务静态资源 — 加入白名单只为让 Outlook 邮件
      正文里的附件 icon 正常渲染. 不为更广的 *.microsoft.com / *.office.com
      开口子, 那些可能包含 tracking pixel.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-JWOW0ZmF4KlXR10H32vpWS66AIWsa1+1swsTHiO0YpE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https://*.onecdn.static.microsoft; connect-src 'self' ws://localhost:* http://localhost:* http://127.0.0.1:*"
    />
    <!--
      Theme bootstrap (REVIEW-LOG C-07): set data-theme + dark class on <html>
      before the renderer paints to avoid FOUC. Mirrors DESIGN.md §17.3.2.
      Keep this script inline + sync — must run before <body> renders.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('mailagent.themeMode') || 'system'
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored
          var root = document.documentElement
          root.setAttribute('data-theme', resolved)
          root.classList.toggle('dark', resolved === 'dark')
          var accent = localStorage.getItem('mailagent.accent')
          if (accent && accent !== 'coral') {
            root.setAttribute('data-accent', accent)
          }
          var surface = localStorage.getItem('mailagent.surface')
          if (surface === 'solid' || surface === 'liquid') {
            root.setAttribute('data-surface', surface)
          }
        } catch (e) {
          /* localStorage may be unavailable; fall through to default dark */
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style id="theme-bootstrap">
      html[data-theme='dark'] {
        background: #0e1013;
        color: #e8eaee;
      }
      html[data-theme='light'] {
        background: #fafafa;
        color: #1a1d22;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
