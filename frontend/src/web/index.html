<!doctype html>
<html lang="zh-CN" data-vib="off">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MailAgent</title>
    <!--
      Content-Security-Policy (web / PWA variant).

      Differences vs the Electron renderer CSP:
        - connect-src 'self' covers same-origin /api/* (Cloudflare tunnel
          serves the API on the same domain as the SPA, so no extra origin
          is needed in prod). The dev-only ws://localhost / http://localhost
          entries are kept because `dev:web` runs Vite's HMR module/ws server
          on localhost AND a server.proxy forwards /api → 127.0.0.1:8200
          (same-origin from the browser's POV, already covered by 'self').
        - manifest-src 'self' so the PWA manifest loads under CSP.
        - worker-src 'self' so the service worker (sw.js, same-origin) can
          register under CSP.
        - img-src keeps data: (cid: inline images are base64 data: URLs,
          mirroring Electron readDataUrl) + blob: (compose staged attachment
          thumbnails via URL.createObjectURL, same-renderer-only) + the
          Microsoft Office CDN icon allowance from the renderer. file: is
          dropped — there is no file:// origin in the browser.

      The inline FOUC bootstrap below is byte-identical to the Electron
      renderer's, so its sha256 hash is unchanged. If that script changes,
      the hash here AND in src/electron/renderer/index.html must be updated.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-+/aDVUkVEjs5BEmxhoHnyHv2iuPqBLuJRmkC6F2x0WY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.onecdn.static.microsoft; connect-src 'self' ws://localhost:* http://localhost:*; manifest-src 'self'; worker-src 'self'"
    />

    <!-- PWA: manifest + theme color (REMOTE-ACCESS §7.1). base is /app/ so
         manifest + icons resolve under that scope. -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#0F0F10" />

    <!-- iOS / iPadOS "添加到主屏幕" (REMOTE-ACCESS §7.3 / §7.4):
         capable → hides Safari chrome; black-translucent lets content extend
         under the status bar, filled by the data-theme background color. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MailAgent" />
    <link rel="apple-touch-icon" href="/app/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app/icons/icon-512.png" />

    <!--
      Theme bootstrap (REVIEW-LOG C-07): set data-theme + dark class on <html>
      before the renderer paints to avoid FOUC. Mirrors DESIGN.md §17.3.2.
      Keep this script inline + sync — must run before <body> renders.
      Byte-identical to the Electron renderer bootstrap (shared CSP hash).
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('mailagent.themeMode') || 'system'
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored
          var root = document.documentElement
          root.setAttribute('data-theme', resolved)
          root.classList.toggle('dark', resolved === 'dark')
          var accent = localStorage.getItem('mailagent.accent')
          if (accent && accent !== 'coral') {
            root.setAttribute('data-accent', accent)
          }
          // 主题 v2: 材质两档 (liquid 已删, 存量值视同 frosted = 不写 attribute)
          var surface = localStorage.getItem('mailagent.surface')
          if (surface === 'solid') {
            root.setAttribute('data-surface', surface)
          }
          // 主题 v2: 玻璃气质 + 高级调节覆写的首帧应用 (appearance.ts
          // applyGlass 同款语义, 含亮色 alpha ≥ 0.72 护栏), 防切档闪烁。
          var mood = localStorage.getItem('mailagent.glassMood')
          root.setAttribute(
            'data-glass',
            mood === 'neutral' || mood === 'bright' ? mood : 'tinted'
          )
          var knobVars = {
            alpha: ['--glass-alpha', ''],
            blur: ['--glass-blur', 'px'],
            sat: ['--glass-sat', ''],
            mix: ['--glass-accent-mix', '%'],
            ambient: ['--ambient', '']
          }
          var knobs = {}
          try {
            knobs = JSON.parse(localStorage.getItem('mailagent.glassKnobs') || '{}') || {}
          } catch (e2) {
            /* 损坏的 JSON → 全部回落气质预设 */
          }
          for (var k in knobVars) {
            var v = knobs[k]
            if (typeof v !== 'number' || !isFinite(v)) continue
            if (k === 'alpha' && resolved === 'light' && v < 0.72) v = 0.72
            root.style.setProperty(knobVars[k][0], v + knobVars[k][1])
          }
        } catch (e) {
          /* localStorage may be unavailable; fall through to default dark */
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <style id="theme-bootstrap">
      html[data-theme='dark'] {
        background: #0e1013;
        color: #e8eaee;
      }
      html[data-theme='light'] {
        background: #fafafa;
        color: #1a1d22;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', system-ui, sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
