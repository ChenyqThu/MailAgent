appId: ink.chenge.mailagent
productName: MailAgent
# Sprint 19 island F6 — mailagent:// custom protocol. electron-builder 顶层
# protocols 对 macOS 自动注入 Info.plist CFBundleURLTypes (无需 extendInfo 重复),
# 对 Win 写注册表. 系统装 .app 后 scheme 注册到本 app: 灵动岛 open_mail/open_notion
# → plugin `open mailagent://email/<id>` → 系统唤起本 app → main open-url handler.
protocols:
  - name: MailAgent Deeplink
    schemes:
      - mailagent
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  # 嵌入式 python 只经 extraResources 进 Contents/Resources/python; 必须从 asar 排除,
  # 否则 asarUnpack: resources/** 会把它再解一份到 app.asar.unpacked (实测重复 ~206M)。
  - '!resources/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,INSTALL.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{ARCHITECTURE.md,BACKEND-INTERFACES.md,DESIGN.md,ISLAND-PLUGIN.md,PROJECT-PLAN.md,REMOTE-ACCESS.md,REVIEW-LOG.md,NOTES.md}'
  - '!SPRINT*-HANDOFF.md'
  - '!mockup-*.html'
  - '!archive/**'
  - '!eslint-rules/**'
  - '!scripts/**'
  - '!tests/**'
  - '!playwright.config.*'
asarUnpack:
  - resources/**
# 打包 P1-2 — 后端运行时 + 胶水脚本 + prompt 模板注入 .app/Contents/Resources/。
# 嵌入式 CPython (build-python-venv.sh 产出) → Resources/python/; cli_runner.ts 的
# packagedResourcesBin() 解析 process.resourcesPath/python/bin/mailagent (自定位 wrapper)。
# scripts/prompts 用 ../  (electron-builder extraResources from 相对 projectDir=frontend/)。
extraResources:
  - from: resources/python
    to: python
  - from: ../scripts
    to: scripts
    filter:
      - create_reply_draft.sh
      - html_clipboard.py
  - from: ../prompts
    to: prompts
    filter:
      - email_inbox.md
      - email_sent.md
  # V2 远程访问 — serve-api 单 origin 服务前端 SPA (vite base=/app/, app.py mount /app)。
  # from 相对 projectDir=frontend/ ⇒ out/web 即 frontend/out/web (build:web 产物)。
  # 落到 Resources/web; serve-api spawn 时注入 MAILAGENT_SPA_DIR=<resources>/web
  # (与 packagedResourcesBin 同锚点 process.resourcesPath)。打包前必须先跑 build:web
  # (见 build:mac → build:web 链), 否则此处找不到 out/web 报错。
  - from: out/web
    to: web
# afterPack — 封签前对嵌入式 python 的 .so/.dylib 预签 (afterSign 事后补签会破坏外层
# seal)。hardenedRuntime 下漏签即 SIGKILL。ad-hoc (identity:null) 先够本地/内部分发;
# 正式 Developer ID 公证待 P6 (Apple 账号)。
afterPack: scripts/afterPack.cjs
mac:
  category: public.app-category.productivity
  # P6 (1.0.0) — Developer ID Application 签名 + notarytool 公证, 解锁 electron-updater
  # 自动更新 (Squirrel.Mac 要求下载的新版与运行中 app 同一 Developer ID 身份)。
  # identity 省略 (非 null) → electron-builder 自动发现 CSC_LINK 导入临时 keychain 的
  # Developer ID Application 证书 (CI 日志打印 identityName 确认选了哪张)。本地无 CSC_LINK
  # 时 electron-builder 在 arm64 上 fallback 到 ad-hoc 签名 (macPackager:245), afterPack.cjs
  # 也走 ad-hoc 全签分支 (本地/内部分发仍可运行)。🔴 CI 缺 CSC_LINK 不会优雅回退而是 build
  # 失败 (空串 secret → importCertificate('') 报 not a file) → build-mac.yml 有 preflight 拦。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # notarize:true → 读 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarytool)。
  # 缺这三个 env 时 electron-builder warn 跳过公证 (仅本地无凭据构建; CI 两条路径都过 preflight)。
  # timestamp 不设 → osx-sign 默认连 Apple TSA 安全时间戳 (公证必需)。
  notarize: true
  # arm64-only 发布 (Apple Silicon)。CI (build-mac.yml) 只 provision arm64 嵌入式
  # python (x64 矩阵 lane 注释/未验证); 若在此保留 x64 target 会打出「外壳 x64 + 内置
  # arm64 python」的坏包 (Intel 上后端起不来), 还要每次手动删 release 资产。故 x64
  # 暂 parked —— 待 Intel runner dogfood 通过, 同时取消 build-mac.yml x64 矩阵再开。
  target:
    - target: dmg
      arch:
        - arm64
    # zip 是 electron-updater 必需的 channel：autoUpdater 通过
    # latest-mac.yml + <name>-<version>-mac.zip.blockmap 做增量。
    - target: zip
      arch:
        - arm64
  minimumSystemVersion: '12.0'
  extendInfo:
    # #7: 移除 NSDocumentsFolderUsageDescription —— 打包态数据库/.env 都在 userData
    # (~/Library/Application Support/...), 不读 ~/Documents。配套把 cli_runner
    # getProjectRoot() 打包态也锚 userData (见 cli_runner.ts), 彻底不碰 TCC 保护的文稿目录,
    # 消除「每次安装后弹读取文稿授权框」(ad-hoc 签名重装重置 TCC → 首次访问重弹)。
    NSDownloadsFolderUsageDescription: MailAgent saves email attachments to your Downloads folder when you export them.
    NSAppleEventsUsageDescription: MailAgent uses Mail.app and Notion automation events to create draft replies and open email pages.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  # DMG 安装窗口布局：左边 .app，右边 Applications 链接（与拖拽箭头方向一致）。
  # 背景图不画 — 走 electron-builder 默认深色棋盘背景，足够清晰。Sprint 8 ad-hoc
  # 签名 + DMG 安装即可,不做 background.png 装饰（V1.5 polish 时再加）。
  window:
    width: 540
    height: 380
  contents:
    - x: 400
      y: 200
      type: link
      path: /Applications
    - x: 140
      y: 200
      type: file
# ── Windows (08-12 win-port; 07-08 拍板: x64 only / 无 Authenticode 签名 / 首版无自更新) ──
# 纯加法段: mac 逻辑零变化。extraResources 顶层定义对 win 同样生效
# (resources/python → <app>/resources/python, PBS win 布局 = python.exe + Lib/site-packages,
#  由 build-python-venv.ps1 产出; cli_runner.getMailagentCommand() win 分支解析 python.exe;
#  create_reply_draft.sh 等 mac 胶水脚本会带进 win 包但无消费点, 体积可忽略)。
# 原生模块 (better-sqlite3/keytar): electron-builder smart unpack 自动落
# app.asar.unpacked, 无需 win 侧 asarUnpack 增项。
# 🔴 win 构建前置 (Electron ABI 纪律, mac 头号坑② 的 win 等价):
#   rebuild:node / rebuild:electron 两个 script 硬编码 --arch=arm64 + codesign, Windows
#   不可用; win 侧保证 Electron ABI 的命令 = `pnpm exec electron-builder install-app-deps`
#   (postinstall 已含)。npmRebuild:false 同 mac —— builder 自身不重编, 跑过 vitest
#   (pnpm test 含 rebuild:node) 后必须重跑 install-app-deps 再 build。
win:
  target:
    - target: nsis
      arch:
        - x64
  # 仓内无 icon.ico (mac 只有 icns + png 系列); electron-builder 对 win.icon 接受 ≥256px
  # png 并自动转 ico (路径相对 buildResources=build/)。缺此行会落 Electron 默认图标。
  icon: icons/512.png
  # 08-17 owner 验收 Windows 版通过 → 转正式发布轨, 原 `publish: null` (07-08「首版无自更新」)
  # 退役: 继承顶层 publish ⇒ electron-builder 产出 `latest.yml` feed + 包内 `app-update.yml`,
  # Windows 端自更新链路即可用 (handlers/updater.ts 全文无平台判定, electron-updater 原生支持
  # NSIS 更新)。
  #
  # 🔴 生成 ≠ 上传: build-win.yml 仍是 `--publish never`, 产物走 artifact, 由 promote-release.yml
  # 在转正式那一步统一 `gh release upload`。这样 win 与 mac 对同一个 tag 的写入**结构性串行**,
  # 不存在两个 workflow 同时「发现 release 不存在 → 创建」的竞态。
nsis:
  # 非 one-click: 无签名安装包过 SmartScreen 后, 给用户可见的安装目录确认步骤
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-win-${arch}.${ext}
npmRebuild: false
# auto-updater 通过 GitHub Releases 走 publish；上传产物（dmg + zip + blockmap +
# latest-mac.yml）到 release，electron-updater 起来后 checkForUpdates() 读
# repository latest tag 比对。
publish:
  provider: github
  owner: chenyqthu
  repo: MailAgent
