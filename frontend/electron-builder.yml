appId: ink.chenge.mailagent
productName: MailAgent
# Sprint 19 island F6 — mailagent:// custom protocol. electron-builder 顶层
# protocols 对 macOS 自动注入 Info.plist CFBundleURLTypes (无需 extendInfo 重复),
# 对 Win 写注册表. 系统装 .app 后 scheme 注册到本 app: 灵动岛 open_mail/open_notion
# → plugin `open mailagent://email/<id>` → 系统唤起本 app → main open-url handler.
protocols:
  - name: MailAgent Deeplink
    schemes:
      - mailagent
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  # 嵌入式 python 只经 extraResources 进 Contents/Resources/python; 必须从 asar 排除,
  # 否则 asarUnpack: resources/** 会把它再解一份到 app.asar.unpacked (实测重复 ~206M)。
  - '!resources/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,INSTALL.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{ARCHITECTURE.md,BACKEND-INTERFACES.md,DESIGN.md,ISLAND-PLUGIN.md,PROJECT-PLAN.md,REMOTE-ACCESS.md,REVIEW-LOG.md,NOTES.md}'
  - '!SPRINT*-HANDOFF.md'
  - '!mockup-*.html'
  - '!archive/**'
  - '!eslint-rules/**'
  - '!scripts/**'
  - '!tests/**'
  - '!playwright.config.*'
asarUnpack:
  - resources/**
# 打包 P1-2 — 后端运行时 + 胶水脚本 + prompt 模板注入 .app/Contents/Resources/。
# 嵌入式 CPython (build-python-venv.sh 产出) → Resources/python/; cli_runner.ts 的
# packagedResourcesBin() 解析 process.resourcesPath/python/bin/mailagent (自定位 wrapper)。
# scripts/prompts 用 ../  (electron-builder extraResources from 相对 projectDir=frontend/)。
extraResources:
  - from: resources/python
    to: python
  - from: ../scripts
    to: scripts
    filter:
      - create_reply_draft.sh
      - html_clipboard.py
  - from: ../prompts
    to: prompts
    filter:
      - email_inbox.md
      - email_sent.md
  # V2 远程访问 — serve-api 单 origin 服务前端 SPA (vite base=/app/, app.py mount /app)。
  # from 相对 projectDir=frontend/ ⇒ out/web 即 frontend/out/web (build:web 产物)。
  # 落到 Resources/web; serve-api spawn 时注入 MAILAGENT_SPA_DIR=<resources>/web
  # (与 packagedResourcesBin 同锚点 process.resourcesPath)。打包前必须先跑 build:web
  # (见 build:mac → build:web 链), 否则此处找不到 out/web 报错。
  - from: out/web
    to: web
# afterPack — 封签前对嵌入式 python 的 .so/.dylib 预签 (afterSign 事后补签会破坏外层
# seal)。hardenedRuntime 下漏签即 SIGKILL。ad-hoc (identity:null) 先够本地/内部分发;
# 正式 Developer ID 公证待 P6 (Apple 账号)。
afterPack: scripts/afterPack.cjs
mac:
  category: public.app-category.productivity
  # Sprint 8 §2.2 — ad-hoc 签名先够（identity: null 走 ad-hoc，no Apple
  # Developer ID; auto-updater 走 GitHub Releases zip blockmap，不需 notarize）。
  # 公证留 V1.5 — 需 $99/y Apple Developer 账号 + .p8 / .p12 + provisioning。
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  # arm64-only 发布 (Apple Silicon)。CI (build-mac.yml) 只 provision arm64 嵌入式
  # python (x64 矩阵 lane 注释/未验证); 若在此保留 x64 target 会打出「外壳 x64 + 内置
  # arm64 python」的坏包 (Intel 上后端起不来), 还要每次手动删 release 资产。故 x64
  # 暂 parked —— 待 Intel runner dogfood 通过, 同时取消 build-mac.yml x64 矩阵再开。
  target:
    - target: dmg
      arch:
        - arm64
    # zip 是 electron-updater 必需的 channel：autoUpdater 通过
    # latest-mac.yml + <name>-<version>-mac.zip.blockmap 做增量。
    - target: zip
      arch:
        - arm64
  minimumSystemVersion: '12.0'
  extendInfo:
    NSDocumentsFolderUsageDescription: MailAgent reads the local SQLite database under your Documents folder.
    NSDownloadsFolderUsageDescription: MailAgent saves email attachments to your Downloads folder when you export them.
    NSAppleEventsUsageDescription: MailAgent uses Mail.app and Notion automation events to create draft replies and open email pages.
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  # DMG 安装窗口布局：左边 .app，右边 Applications 链接（与拖拽箭头方向一致）。
  # 背景图不画 — 走 electron-builder 默认深色棋盘背景，足够清晰。Sprint 8 ad-hoc
  # 签名 + DMG 安装即可,不做 background.png 装饰（V1.5 polish 时再加）。
  window:
    width: 540
    height: 380
  contents:
    - x: 400
      y: 200
      type: link
      path: /Applications
    - x: 140
      y: 200
      type: file
npmRebuild: false
# auto-updater 通过 GitHub Releases 走 publish；上传产物（dmg + zip + blockmap +
# latest-mac.yml）到 release，electron-updater 起来后 checkForUpdates() 读
# repository latest tag 比对。
publish:
  provider: github
  owner: chenyqthu
  repo: MailAgent
