[project]
name = "mailagent"
version = "3.0.0"
description = "macOS Mail.app to Notion real-time sync system"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
mailagent = "src.cli.main:app"
mailagent-mcp = "src.mcp.mailagent_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "jsonschema>=4.18,<5",
    "referencing>=0.30",
    # F821 未定义名闸（tests/config/test_python_undefined_names.py）的运行时依赖：
    # 2026-08-22 service.py 漏 NotifyCenter import 潜伏到装机首启才 NameError 炸死
    # 主服务——测试从不构造 App，这类错只有静态扫描拦得住。
    "ruff>=0.4",
]
cli = [
    "typer>=0.12,<0.14",
    "click>=8.1,<8.2",        # typer 0.12-0.13.x incompatible with click 8.2+ (make_metavar signature)
    "rich>=13,<15",
    "pyyaml>=6,<7",
]
# V2 远程访问本地 FastAPI 后端 (mailagent-api, `mailagent serve-api`).
# 详见 frontend/REMOTE-ACCESS.md §3。安装: pip install -e ".[cli,api]"
api = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.27,<0.35",
    "pyjwt[crypto]>=2.8,<3",  # PyJWKClient + RS256 verify (CF Access JWT, §6.3); crypto extra 拉 cryptography
    "httpx>=0.27",            # cli_runner / TestClient (email unsubscribe 已传递引入)
    # 08-01 阶段 1 PR1 (MCP connector): serve-api 持 MCP client (src/connectors/)。
    # v2 拍板依据见 .trellis/tasks/08-01-mcp-connector-notion-jira-harness/research/
    # mcp-sdk-dependency-review-0803.md (v1.x 官方维护模式只收安全补丁)。带 httpx2 双 HTTP 栈
    # (独立 import 名, 与 httpx 并存无冲突)。回退线 = mcp>=1.28,<2 (Client→ClientSession 改写)。
    "mcp>=2.0.0,<3",
    # 🔴 mcp 传递依赖 sse-starlette 的显式上界: 3.1+ 硬性要求 starlette>=0.49.1, 与
    # fastapi<0.116 (starlette<0.47) 冲突; 3.0.3 无 starlette 硬约束。裸解析时 pip 能
    # backtrack 到位, 但显式钉住让解析确定 + 把"为什么"留在案 (升 fastapi 后可放开)。
    "sse-starlette>=3.0,<3.1",
]
# M1/M2 mem0 记忆引擎（auto-capture 写 + query 召回读）。重依赖（onnxruntime/faiss/fastembed
# ~150MB+），仅 MAILAGENT_MEM0_CAPTURE / MAILAGENT_MEM0_RETRIEVAL 开时运行期 import；嵌入式打包
# 经 build-python-venv.sh 纳入。需 Python >=3.11（fastembed/onnxruntime）。注意：mem0ai 会把
# pydantic 提到 >=2.7、typer>=0.15、click>=8.2（实测兼容现有 CLI/config，仅触发 pydantic env=
# Field deprecation warning）。
# 🔴 版本钉死（codex review MEDIUM-1）：mem0ai 2.x 的 search(filters/top_k)+{results} shape 是
# API-敏感契约（顶层 user_id=/limit= 会 ValueError），faiss/fastembed 的 cache/索引行为也版本相关
# → 用 == 钉到已验证版本（tests/memory + smoke_mem0_engine.py 绿），防同一 commit 不同时间 build
# 出不同运行时行为。升级须重跑 scripts/dev/smoke_mem0_engine.py + tests/memory 验证 API/行为不漂移。
# onnxruntime = fastembed 的 ONNX 后端，一并钉死锁住嵌入推理行为。
memory = [
    "mem0ai==2.0.10",
    "faiss-cpu==1.14.3",
    "fastembed==0.8.0",
    "onnxruntime==1.27.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 把项目根当 package root, 让 `src/` 成为顶层 package (与 main.py / pm2 / tests/ 一致, 不用 src-layout 重组)
where = ["."]
include = ["src*"]
exclude = ["tests*", "scripts*", "venv*", "data*", "logs*"]

[tool.setuptools.package-data]
# 🔴 builtin skill 的 SKILL.md 是**运行时**读的（/api/agent/skills/{name}/doc → skill_read），
# 不是文档。setuptools 默认只装 .py，漏声明 → 打包 .app 的 site-packages 里没有这 6 份文件 →
# 仓内运行正常、装机后 404（功能只在开发机上是真的）。加/改 builtin 文档路径同步改这里。
"src.skills" = ["docs/*/SKILL.md"]

[tool.ruff.lint.per-file-ignores]
"docs/cli-schema/*.json" = ["F821"]
