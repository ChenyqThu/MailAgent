[project]
name = "mailagent"
version = "3.0.0"
description = "macOS Mail.app to Notion real-time sync system"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
mailagent = "src.cli.main:app"
mailagent-mcp = "src.mcp.mailagent_mcp:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "jsonschema>=4.18,<5",
    "referencing>=0.30",
]
cli = [
    "typer>=0.12,<0.14",
    "click>=8.1,<8.2",        # typer 0.12-0.13.x incompatible with click 8.2+ (make_metavar signature)
    "rich>=13,<15",
    "pyyaml>=6,<7",
]
# V2 远程访问本地 FastAPI 后端 (mailagent-api, `mailagent serve-api`).
# 详见 frontend/REMOTE-ACCESS.md §3。安装: pip install -e ".[cli,api]"
api = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.27,<0.35",
    "pyjwt[crypto]>=2.8,<3",  # PyJWKClient + RS256 verify (CF Access JWT, §6.3); crypto extra 拉 cryptography
    "httpx>=0.27",            # cli_runner / TestClient (email unsubscribe 已传递引入)
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 把项目根当 package root, 让 `src/` 成为顶层 package (与 main.py / pm2 / tests/ 一致, 不用 src-layout 重组)
where = ["."]
include = ["src*"]
exclude = ["tests*", "scripts*", "venv*", "data*", "logs*"]

[tool.ruff.lint.per-file-ignores]
"docs/cli-schema/*.json" = ["F821"]
