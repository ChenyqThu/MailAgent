[project]
name = "mailagent"
version = "3.0.0"
description = "macOS Mail.app to Notion real-time sync system"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
mailagent = "src.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
cli = [
    "typer>=0.12,<0.14",
    "click>=8.1,<8.2",        # typer 0.12-0.13.x incompatible with click 8.2+ (make_metavar signature)
    "rich>=13,<15",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# 把项目根当 package root, 让 `src/` 成为顶层 package (与 main.py / pm2 / tests/ 一致, 不用 src-layout 重组)
where = ["."]
include = ["src*"]
exclude = ["tests*", "scripts*", "venv*", "data*", "logs*"]
