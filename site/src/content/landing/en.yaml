hero:
  pill: A personal AI workspace
  pillTag: v3
  title: Hand off the routine. Keep the judgment.
  titleEm: Keep the judgment.
  sub: >-
    Email, calendar, matters, people and files, gathered into one workspace on your own machine.
    A team of named agents, each with clear limits, reads, follows up, drafts and files — and
    only what needs your decision reaches you. Every step traces back to its source.
  ctaPrimary: Download MailAgent
  ctaGhost: See how it works
