faq:
  eyebrow: FAQ
  title: A few more things
  items:
    - q: Where does my mail go?
      a: >-
        Mail is synced and stored in a local SQLite database on your machine,
        read directly by Electron. Only AI processing sends relevant content to
        the model you configure. The email body is never sent out for translation.
    - q: Will it send or archive on its own?
      a: >-
        No. In v1, suggested actions are display-only — you stay in control.
        Replies are drafts; archiving is your click. Bulk execution is for a
        later version and always behind your confirmation.
    - q: Can I trust the numbers in reports?
      a: >-
        Yes. All counts, links and email IDs are computed and back-filled by
        code, consistent with the database. The LLM only handles wording,
        grouping and highlights; any ID it emits is validated, and invented ones
        are discarded.
    - q: Which languages and models?
      a: >-
        The UI, fields and AI quick-actions toggle between 简体中文 and English;
        the email body stays in its original language. The default model is
        claude-sonnet-4-6, swappable in settings.
    - q: What kind of project is this?
      a: >-
        MailAgent is an open-source personal project — an AI email assistant for
        heavy mail users. The design system, Ping Island, report agent and KOS
        bridge all live in a public repo. Star it, file issues, or run your own.

