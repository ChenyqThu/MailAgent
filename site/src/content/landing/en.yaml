strip:
  label: Once an email lands
  items:
    - Triaged
    - Summarized
    - Reply drafted
    - Linked to a matter
    - Sender on file
    - Searchable

today:
  eyebrow: Today
  title: Every day begins on one page.
  titleEm: one page
  lede: >-
    Today gathers what needs you: approvals waiting on a decision, the day's meetings, replies
    you owe, matters coming due, and whatever your agents just finished. One read, and the
    shape of the day is clear.
  points:
    - title: More than yes or no
      body: Run it as proposed, edit the parameters first, or answer in a sentence — a refusal goes back to the agent with your reason attached.
    - title: Replies, grouped by thread
      body: One row per thread, collapsed by default. Mark a thread as needing no reply and it stays quiet — until someone writes again.
    - title: One bell for everything
      body: The notification center collects agent results, pending approvals, matter alerts and system warnings. Snooze, mark handled, or jump straight to the source.

triage:
  eyebrow: Triage
  title: Read the moment it arrives.
  titleEm: the moment it arrives
  lede: >-
    Not batch clean-up after the fact — every email is processed as it lands. Category, priority,
    a one-line summary and the next step are written into each message as structured fields,
    so the list tells you what to open first.
  points:
    - title: Judgments as fields, not prose
      body: The model returns structured fields, rendered natively — checkable, and markable as reviewed. Define your own categories and it follows them.
    - title: A reply, already drafted
      body: For mail that needs an answer, a draft is waiting in context. Change a line or send it as is — sending always waits for you.
    - title: Search that finds it
      body: A local full-text index covers bodies and attachments, with CJK substring matching and field syntax. When you can't name what you're after, hand it to AI search — both run on the same engine.

matters:
  eyebrow: Matters
  title: One piece of work, start to finish, in one place.
  titleEm: in one place
  lede: >-
    Emails are clues; the work is what you're actually moving forward. A matter keeps the
    background and goal, action items, stakeholders, threads, meetings and files on one page.
    A follow-up agent keeps watch — but it only proposes. You decide what's written.
  points:
    - title: Action items an agent can take
      body: Each item has its own run state and report. When the agent needs an answer from you, it stops and asks instead of spinning.
    - title: Follow-up that only proposes
      body: The follow-up agent wakes on a schedule, a new email or a meeting's end, gathers evidence and suggests updates. You accept or decline each one.
    - title: Progress, kept apart from the log
      body: Progress tells the story of the work; the activity log records who changed what. You read a narrative, not a ledger.

people:
  eyebrow: People & Time
  title: People and time are context, too.
  titleEm: context, too
  lede: >-
    Contacts builds a profile for everyone you correspond or meet with, merging addresses into
    people. The calendar layers mailbox events, matter deadlines and agent schedules into one
    view. Your agents know who you work with, and when you're free.
  points:
    - title: Profiles with sources
      body: An AI profile notes what you discuss and what you've built together, each sentence footnoted back to the email. Identity changes arrive as suggestions and apply only once accepted.
    - title: Reporting lines at a glance
      body: Set a manager and the profile shows reports and peers; compose with their manager on cc in one step.
    - title: Three sources, one calendar
      body: Mailbox events, matter deadlines and agent schedules, each toggleable. Drag to reschedule with five seconds to undo; conflicts are flagged.

library:
  eyebrow: Library
  title: Your files, legible to your agents.
  titleEm: legible to your agents
  lede: >-
    Email attachments, chat attachments, documents your agents write, and folders you mount
    from disk form one file tree. Files stay where they are; the index holds only metadata.
    Download the semantic model once, and search runs entirely on your machine.
  points:
    - title: Mount without moving
      body: Mount any folder as read-only or writable. Unmount it, and not a single file on disk is touched.
    - title: A snapshot with every write
      body: Text files keep their history — compare or roll back at any time.
    - title: Write limits, enforced by the server
      body: Custom agents write only to Agent docs; unattended runs may only append. Overwrite, move and delete all go through approval. Library is available on macOS.

team:
  eyebrow: Team
  title: A team, each member with a name.
  titleEm: with a name
  lede: >-
    Your main agent has its own name and face, alongside members with distinct jobs — the daily
    report, meeting prep, matter follow-up. They wake on the rules you set and act within the
    capabilities you grant; every run leaves a complete record.
  points:
    - title: You decide when they wake
      body: On a schedule, a new email, a specific thread, a calendar change, or hours before a meeting — triggers stack, and each can be switched on or off.
    - title: Capabilities, granted by card
      body: Mail, calendar, library, web, external services — grant them card by card, and narrow down to single tools when you need to.
    - title: Every run reads as a conversation
      body: Trigger, reasoning, tool calls and output, laid out in order. Runs that produce a report open straight to the full text.
    - title: Group chat (Labs)
      body: Put several members in one group and let them pick up where the others leave off. Each group keeps its own budget and usage ledger.

reports:
  eyebrow: Reports
  title: A morning report you can actually finish.
  titleEm: actually finish
  lede: >-
    The report agent looks back over your mail and matters and writes a structured report: what
    was handled, what still needs you, what moved forward. Daily, weekly and monthly, from one engine.
  points:
    - title: Numbers computed by code
      body: Totals, unread, urgent, handled — every statistic and trend is computed deterministically and matches the database. None of it is estimated by a model.
    - title: Every email links back
      body: Each email a report mentions links to the message itself; daily, weekly and monthly reports also summarize your matters.
    - title: Scheduling by picking
      body: Pick the hour, pick the weekday. If a slot is missed, it runs once when the app starts that day.

chat:
  eyebrow: AI chat
  title: Ask about the email, or the whole matter.
  titleEm: the whole matter
  lede: >-
    Summon the main agent from anywhere. It brings the email, matter or file in front of you
    into the conversation, searches, reads and compares on its own, and cites what it found.
  points:
    - title: Your choice of model
      body: Metadata for 480 models across 18 providers, refreshed daily from the cloud. Each conversation remembers its own model and reasoning effort.
    - title: Call on it with @
      body: Mention an email, a matter, a file or a custom agent. A mentioned agent takes the task and finishes it in its own sub-conversation.
    - title: Long conversations, remembered
      body: Context usage is always visible; near the limit it compacts into a summary, and the full history stays. Keep typing mid-answer — your messages queue.

trust:
  eyebrow: Limits & trust
  title: You draw the lines.
  titleEm: draw the lines
  lede: >-
    Letting an agent act for you starts with knowing it won't overstep. MailAgent builds its
    limits into the structure, not into a prompt.
  points:
    - title: A setting for every tool
      body: Run directly, ask first, or disabled — set per tool. Frequent, reversible actions like drafting, flagging and archiving run directly by default; the rest ask first.
    - title: Sending mail always asks
      body: Sending email, running commands, installing skills and changing agents always ask, and that can't be lowered. The only exception for sending is a recipient allowlist you set yourself.
    - title: The card shows what will happen
      body: Recipients, subject and changes on an approval card are generated by the server from the real payload, not paraphrased from the model.
    - title: Write scope, enforced by the server
      body: Which folders and files an agent may write is decided by the backend, not by the agent. Unattended runs may only append.
    - title: Numbers filled in by code
      body: Statistics, links and email IDs in a report are filled in deterministically. IDs the model supplies are checked, and invented ones are dropped.
    - title: Your data stays on your machine
      body: Mail, indexes and files live on your computer. Only the model provider you configure sees the portion it's asked to process.

connect:
  eyebrow: Beyond the desktop
  title: Away from the desk, the same limits hold.
  titleEm: the same limits hold
  lede: >-
    Chat with it in Feishu, check Today from a phone browser, let it look things up in Notion,
    Jira or GitHub, or hand your inbox to an agent of your own. Wherever it runs, approvals and
    permissions still apply.
  cards:
    - title: External services (Labs)
      body: Connect 16 services over MCP, including Notion, Jira, Confluence, Slack, GitHub, Linear and Figma. Authorize in the browser; credentials are encrypted on your machine.
    - title: Feishu chat
      body: The same assistant and memory in a Feishu direct message. Actions that need approval arrive as button cards — one tap to allow. Uses a persistent connection; no public address needed.
    - title: Remote web
      body: Host your own web entry point to read mail, Today and reports on the go. Features that depend on local services, such as Library and group chat, stay on the desktop.
    - title: Your own agent
      body: Issue scoped access keys and call mail reading, search, reports and calendar over REST or MCP. Write and send actions require explicit confirmation.

download:
  eyebrow: Get MailAgent
  title: Hand it the routine.
  body: A local-first desktop app with public source. Download, connect your mailbox, choose a model — and it starts with the next email.
  ctaPrimary: Download for macOS
  ctaWin: Download for Windows
  ctaGhost: View source on GitHub
  steps:
    - { kicker: STEP 01, title: Install, body: 'Get the latest installer from GitHub Releases: .dmg for macOS, .exe for Windows.' }
    - { kicker: STEP 02, title: Connect your mailbox, body: 'Pick a mail backend in the first-run wizard: DavMail, or local Outlook on Windows. Notion is optional, with one-click authorization.' }
    - { kicker: STEP 03, title: Choose a model, body: 'Add your own model provider key, switch on the agents you want, and it starts with the next email.' }
  note: macOS 12+ (Apple silicon) · Windows x64 · Bring your own model key · Your mail and files stay on your machine

faq:
  eyebrow: FAQ
  title: A few more questions
  items:
    - q: Where does my email go?
      a: >-
        Mail, the search index and your files live in a local database on your computer, read and
        written directly by the app. Content is sent only to the model provider you configure, and
        only when AI processing needs it. The Notion mirror, Feishu and external services are all
        optional — switched off, nothing flows to them.
    - q: Will it send mail or delete things on its own?
      a: >-
        No. Every tool has an approval setting. Sending mail, running commands, installing skills and
        changing agents always ask, and sending is only exempt for a recipient allowlist you set
        yourself. Reversible actions like drafting, flagging and archiving run directly by default;
        you can switch any of them to ask first.
    - q: Which models does it support?
      a: >-
        It ships model metadata for 18 providers, including Anthropic, OpenAI, Google, DeepSeek,
        Mistral, xAI, Qwen, Kimi and Zhipu, and connects to OpenRouter or any OpenAI-compatible
        service. You use your own keys and pay the provider directly.
    - q: Do I need Notion?
      a: >-
        No. The local database is the source of truth for email bodies and attachments; Notion is an
        optional mirror. If you want it, authorize it in one click from Settings.
    - q: How does the Windows version differ from macOS?
      a: >-
        On Windows, MailAgent can send, receive and sync through your locally installed Outlook, with
        no DavMail required; the calendar isn't available in that mode yet. Library is currently
        macOS-only.
    - q: What kind of project is this?
      a: >-
        MailAgent is a personal open-source project, built for people who spend their days in email.
        The source is public on GitHub under GPL-3.0 — read it, file an issue, or run your own copy.

