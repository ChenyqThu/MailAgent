features:
  eyebrow: AI Triage
  title: Every email arrives already read.
  titleEm: already read
  lede: >-
    Not a batch job after the fact — processed on arrival. Category, priority,
    a one-line summary and a suggested action, written structurally into every
    message so the list tells you what to open first.
  cards:
    - kicker: Category · Priority
      title: Category & priority, at a glance
      body: >-
        Each email is tagged with a category (product, decision-needed, FYI…)
        and a priority. Critical mail surfaces in red; FYI settles to the
        bottom — no more digging through 674 messages.
    - kicker: Summary
      title: One-line summaries
      body: >-
        Long threads and deep quote chains, compressed into a point you read in
        two seconds — before you ever open it.
    - kicker: Reply Suggestion
      title: Replies, pre-drafted
      body: >-
        For mail that needs a reply, a context-aware draft is waiting. Tweak a
        line or send as-is — you stay in control.
    - kicker: Action
      title: A suggested next step
      body: >-
        "Needs a decision," "awaiting sign-off," "archive" — it tells you not
        just what an email says, but what to do with it.
    - kicker: Full-text · AI search
      title: Find it — and find it precisely
      body: >-
        A local FTS5 index over email bodies and attachment text. Hit ⌘K for
        millisecond results, Gmail-style field filters and Chinese substring
        matching — and when keywords fall short, hand it to AI search in plain
        language. Manual and AI share one engine, so the results match.

aiFields:
  eyebrow: AI Fields
  title: The AI's reasoning, right there in the email
  body: >-
    Every email carries an AI FIELDS panel up top: summary, priority, action,
    category, reply suggestion — all structured, reviewable, and markable as
    "reviewed." Not a black box; a transparent assistant.
  points:
    - title: Structured fields, not prose
      body: The LLM emits JSON blocks rendered natively — stable, checkable, back-fillable.
    - title: Bilingual UI, body untouched
      body: UI, fields and actions switch CN/EN; the email body always stays in its original language.
    - title: You set the tone
      body: Six accent colors, light/dark, interface materials — one switch re-skins everything.

island:
  eyebrow: Ping Island · Live
  title: The mail that matters comes to you
  body: >-
    MailAgent pushes what's critical to the Dynamic Island. A high-priority
    email lands, gets triaged, and its gist and suggested action float at the
    top of your screen — no app, no inbox dive.
  points:
    - title: Real-time pings
      body: Only the genuinely urgent interrupts you; the rest is archived in silence.
    - title: Act from the island
      body: Archive, snooze, open — common actions in a single tap.
    - title: Twice-daily digest
      body: At 9am and 6pm, the island sums up the last 24 hours.

report:
  eyebrow: Report Agent
  title: A daily briefing you'll actually finish
  titleEm: actually finish
  lede: >-
    Jarvis reviews the last 24 hours and curates a structured report: what's
    been handled, what still needs you, the key facts you must know, and the
    rest summarized. Weekly and monthly run on the same engine.
  points:
    - title: Daily / weekly / monthly, scheduled
      body: >-
        Detail by day, trends by week, a high-level recap by month — with
        catch-up on launch so nothing is missed.
    - title: Every line links to source
      body: Every email in the report is clickable — straight to the message in-app or its Notion page.
    - title: Trends from real counts
      body: Weekly and monthly stats are computed deterministically in code — never hallucinated by the model.
    - title: Run now · edit prompt · pick model
      body: Generate on demand, adjust the schedule, and edit the report prompt right in /agents.

customAI:
  eyebrow: Custom AI · KOS
  title: Ask about an email — it goes and looks things up
  body: >-
    Custom AI bridges to the KOS knowledge base over MCP — email sources, an
    entity graph, historical trajectories. The model decides what to query from
    context and answers with citations. We don't spoon-feed it; we hand it the
    tools and let it drive.
  points:
    - title: Read-only guardrails
      body: >-
        Only read tools (query, search, traverse) are exposed; writes are
        blocked at the bridge to keep the graph clean.
    - title: Graceful degradation
      body: If KOS is offline, it falls back to local FTS5 search — the conversation never breaks.

agentDelivery:
  eyebrow: Agent Delivery
  title: Hand your inbox capabilities to your own agent
  body: >-
    MailAgent exposes one thing outward: a Skill layer. Mint a scope-narrowed
    Bearer key and your agent can read email, run full-text search, and pull
    reports or calendar over REST or MCP. Every capability flows from one
    authoritative Python manifest; write/send tools require explicit confirm.
  points:
    - title: Scoped Bearer key
      body: >-
        mailagent api-key create issues keys by preset / scope (prefix mak_);
        bad, revoked, or expired keys fail closed with 403.
    - title: Authoritative Python manifest
      body: >-
        src/skills is the single source of truth — REST, MCP, and the skill
        pack all derive from one manifest, so nothing drifts.
    - title: REST /api/skills + invoke
      body: >-
        GET returns a scope-filtered manifest; POST /invoke calls a tool.
        Write/send tools must carry confirm:true.
    - title: MCP stdio + skill pack
      body: >-
        mailagent-mcp plugs straight into Claude Desktop / Code;
        export_skill_pack.py emits a ready client config plus a selftest script.

provenance:
  eyebrow: Provenance
  title: The AI writes the prose. Code guards the numbers.
  titleEm: Code guards the numbers.
  lede: >-
    The one thing an email assistant must never do is make things up.
    MailAgent's discipline: counts, links and email IDs are back-filled
    deterministically by code; the LLM only handles wording and grouping. The
    blast radius of a mistake is confined to phrasing.
  points:
    - title: Numbers computed in code
      body: Totals, unread, urgent, processed, pending — all deterministic and consistent with the database.
    - title: Hallucinated IDs discarded
      body: Any email ID the model emits is validated against the real candidate set; invented ones are dropped.
    - title: Links are authoritative
      body: Every source link is generated from a real page_id — it always lands on the right message.
    - title: Local-first
      body: Mail lives in local SQLite read directly by Electron; the body is never sent out for translation.

observability:
  eyebrow: Observability
  title: Every call, fully accounted for
  titleEm: fully accounted for
  lede: >-
    The LLM and system dashboards lay the real numbers bare: throughput, tokens,
    latency, cache hits, sync health, dead-letter queue. Not decorative charts —
    the actual ledger of 5,904 runs.
  stats:
    - { value: '5,904', key: Processed · 7d, sub: over the last week }
    - { value: '1.11M', key: Input tokens, sub: input tokens }
    - { value: '42.5s', key: Avg latency, sub: average per email }
    - { value: '9,311', key: Synced mail, sub: emails synced }

