seo:
  title: MailAgent — A personal AI workspace that starts with your email
  description: >-
    MailAgent is a local-first desktop workspace. Email, calendar, matters, people and files
    in one place, with a team of named, bounded AI agents handling the routine — every step
    traceable to its source. For macOS and Windows.

