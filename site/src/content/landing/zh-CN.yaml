  pillTag: v3
  title: 把日常交给 agent，把判断留给自己。
  titleEm: 把判断留给自己
  sub: >-
    邮件、日历、事项、联系人与资料，收进同一台本机工作台。一组有名字、有边界的 agent
    替你读信、跟进、起草、整理；只有需要你拍板的事，才会来到面前。每一步，都能追溯到原文。
  ctaPrimary: 下载 MailAgent
  ctaGhost: 看看它怎么工作
