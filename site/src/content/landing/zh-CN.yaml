hero:
  pill: 把 AI 装进你的收件箱
  pillTag: v1 · macOS
  title: 你的收件箱，有人盯着了。
  titleEm: 有人盯着了
  sub: >-
    MailAgent 在邮件落地的那一刻就替你读完它——自动分类、定优先级、写摘要、起草回复。
    重要的浮上来，杂讯沉下去，全程可点回原文。
  ctaPrimary: 下载 macOS 版
  ctaGhost: 看看它怎么干活
  meta:
