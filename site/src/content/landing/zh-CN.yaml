seo:
  title: MailAgent — 让 AI 替你看完每一封邮件
  description: >-
    MailAgent · 一个把 AI 装进收件箱的桌面邮件助手。自动分类、定级、摘要、起草回复，
    灵动岛实时提醒，每日报告 Agent，全程可溯源。

