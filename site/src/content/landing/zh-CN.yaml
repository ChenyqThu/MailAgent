seo:
  title: MailAgent — 以邮件为起点的个人 AI 工作台
  description: >-
    MailAgent 是一台本地优先的桌面工作台：邮件、日历、事项、联系人与资料汇于一处，
    一组有名字、有边界的 AI Agent 替你处理日常，每一步都能追溯到原文。支持 macOS 与 Windows。

